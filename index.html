<!DOCTYPE html>
<html lang="ko">
<head> <link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FFD54F">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>탭 보드</title>
  <meta property="og:title" content="Tab Board · 탭 보드">
<meta property="og:description" content="여러 프로젝트를 오가도, 어디까지 했는지 바로 이어서.">
<meta property="og:image" content="https://danchu-cloud.github.io/tab-board/tab-board-preview.png">
<meta property="og:url" content="https://danchu-cloud.github.io/tab-board/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F8F8F3; --grid:rgba(70,100,150,.09); --sheet:#FFFFFC; --rule:rgba(70,110,170,.13); --margin:#E07A6B;
  --note:#FFFDF2; --ink:#2A2B2E; --muted:#6C6D70; --line:#BFC1BA; --accent:#2F5BD3; --accent-ink:#FFFFFF;
  --hl:#FFE24D; --warn:#D3452A; --tape:rgba(236,226,190,.78); --lift:rgba(40,35,20,.22);
  --wob:255px 15px 225px 15px/15px 225px 15px 255px;
  --hand:"Nanum Pen Script","Gaegu",cursive;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1C1E1B; --grid:rgba(255,255,255,.045); --sheet:#232521; --rule:rgba(255,255,255,.06); --margin:#B9584B;
  --note:#2A2C27; --ink:#ECEBE3; --muted:#A4A49B; --line:#4B4D47; --accent:#93B2FF; --accent-ink:#121A33;
  --hl:#B89A12; --warn:#FF8C6E; --tape:rgba(210,200,165,.22); --lift:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1C1E1B; --grid:rgba(255,255,255,.045); --sheet:#232521; --rule:rgba(255,255,255,.06); --margin:#B9584B;
  --note:#2A2C27; --ink:#ECEBE3; --muted:#A4A49B; --line:#4B4D47; --accent:#93B2FF; --accent-ink:#121A33;
  --hl:#B89A12; --warn:#FF8C6E; --tape:rgba(210,200,165,.22); --lift:rgba(0,0,0,.5); color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px dashed var(--accent);outline-offset:3px}

/* header: notebook cover strip */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:14px clamp(16px,4vw,40px) 12px;border-bottom:2px dashed var(--line)}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:1280px;margin:0 auto}
h1{font-family:var(--hand);font-weight:400;font-size:44px;line-height:1;margin:0;
  text-decoration:underline;text-decoration-color:var(--hl);text-decoration-thickness:12px;text-underline-offset:-6px;text-decoration-skip-ink:none}
.sync{font-family:var(--hand);font-size:20px;color:var(--muted)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tools .sync{margin-right:4px}
.linkbtn{background:none;border:none;padding:0 0 0 4px;color:var(--accent);text-decoration:underline;font:inherit;cursor:pointer}
.bk-banner{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 26px;padding:12px 16px;
  background:color-mix(in srgb,var(--hl) 38%,var(--note));transform:rotate(-.3deg);box-shadow:0 10px 14px -10px var(--lift);font-size:14px}
.bk-banner[hidden]{display:none}
.bk-banner .row{margin:0}
#fileDlg p{margin:0 0 12px;font-size:14px;color:var(--muted)}
#fileDlg .fname{font-weight:700;color:var(--ink);word-break:break-all}
#fileDlg .opts{display:grid;gap:8px;margin:6px 0 14px}
#fileDlg .opts .btn{width:100%;height:auto;min-height:44px;padding:8px 14px;text-align:left}
#fileDlg .opts small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
#fileDlg .opts .primary small{color:inherit;opacity:.75}
.capture{display:flex;gap:10px;max-width:1280px;margin:10px auto 0;flex-wrap:wrap;align-items:flex-end}
.capture input[type=text]{flex:1 1 320px;min-width:0;height:44px;padding:0 4px;border:none;border-bottom:2px solid var(--ink);border-radius:0;background:transparent;font-size:16px}
.capture input[type=text]:focus{outline:none;border-bottom-color:var(--accent)}
.capture select{height:40px;padding:0 6px;border:none;border-bottom:2px solid var(--line);border-radius:0;background:transparent;max-width:180px}
.btn{height:42px;padding:0 18px;border:2px solid var(--ink);border-radius:var(--wob);background:var(--sheet);font-weight:700}
.btn.primary{background:var(--ink);color:var(--paper);box-shadow:3px 3px 0 var(--hl)}
.btn.primary:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--hl)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.small{height:34px;padding:0 12px;font-size:13.5px}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.ghost.danger{border-color:transparent;text-decoration:underline wavy}
.hint{font-size:12.5px;color:var(--muted);max-width:1280px;margin:6px auto 0}
select{color-scheme:inherit}
select option,select optgroup{background-color:var(--sheet);color:var(--ink)}
select option:checked{background-color:color-mix(in srgb,var(--accent) 22%,var(--sheet));color:var(--ink)}
kbd{font-family:inherit;font-size:11.5px;border:1.5px solid var(--ink);border-radius:4px;padding:0 5px;background:var(--sheet)}

main{max-width:1280px;margin:0 auto;padding:18px clamp(16px,4vw,40px) 56px}
.filters{display:flex;gap:4px;margin-bottom:30px;flex-wrap:wrap}
.filters button{border:2px solid transparent;background:transparent;border-radius:var(--wob);padding:0 12px;font-family:var(--hand);font-size:23px;color:var(--muted)}
.filters button[aria-pressed=true]{color:var(--accent);border-color:var(--accent);transform:rotate(-1.5deg)}
.filters button[data-f=trash]{margin-left:auto}

/* post-it cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:40px 28px}
.card{position:relative;display:flex;flex-direction:column;text-align:left;width:100%;min-height:228px;
  padding:26px 18px 14px;border:none;border-radius:2px 2px 10px 2px;
  background:var(--note);background:color-mix(in srgb,var(--c) 24%,var(--note));
  transform:rotate(var(--r,0deg));box-shadow:0 1px 1px rgba(0,0,0,.06),0 14px 18px -12px var(--lift)}
.card::before{content:"";position:absolute;top:-11px;left:50%;width:92px;height:24px;transform:translateX(-50%) rotate(-2.5deg);
  background:var(--tape);border-left:2px dotted rgba(0,0,0,.06);border-right:2px dotted rgba(0,0,0,.06)}
.card::after{content:"";position:absolute;right:0;bottom:0;width:22px;height:22px;border-radius:0 0 10px 0;
  background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.07) 50%)}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .18s ease,box-shadow .18s ease}}
.card:hover{transform:rotate(0deg) translateY(-4px);box-shadow:0 1px 1px rgba(0,0,0,.06),0 22px 24px -14px var(--lift)}
.tab{font-family:var(--hand);font-size:27px;line-height:1.05;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tab .nm{display:inline}
.tab .swatch{display:none}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{font-size:12px;padding:0 8px;border:1.5px solid rgba(0,0,0,.18);border-radius:var(--wob);color:var(--ink);background:rgba(255,255,255,.35)}
.pill.stale{color:var(--warn);border-color:var(--warn);font-weight:700;background:transparent;transform:rotate(-2deg)}
.next-label{font-size:12px;color:var(--muted)}
.next{font-size:16.5px;font-weight:700;line-height:1.45;margin:2px 0 12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.next.empty{color:var(--muted);font-size:14.5px;font-weight:400}
.last{font-size:13.5px;color:var(--muted);margin-top:auto;padding-top:10px;border-top:1.5px dashed rgba(0,0,0,.18)}
.last p{margin:3px 0 0;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:8px}
.card.add{align-items:center;justify-content:center;background:transparent;border:2.5px dashed var(--line);border-radius:var(--wob);box-shadow:none;transform:none;
  font-family:var(--hand);font-size:27px;color:var(--muted)}
.card.add::before,.card.add::after{display:none}
.card.add:hover{color:var(--ink);border-color:var(--ink)}
.card.inbox{--c:#9AA0A6}
.card.trashed{filter:grayscale(.65);opacity:.9}
.card.trashed .row{margin-top:auto;padding-top:10px}
.empty-state{grid-column:1/-1;text-align:center;color:var(--muted);font-family:var(--hand);font-size:26px;padding:40px 0}
.trash-bar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13.5px;margin-bottom:-10px}

/* type colors + highlighter chips */
.t-memo{--tc:#9A9B96} .t-idea{--tc:#E8B10F} .t-decision{--tc:#3D6BE0} .t-todo{--tc:#1F9E7A} .t-feedback{--tc:#E0613F} .t-ref{--tc:#9A5CD6}
.chip{display:inline-block;font-family:var(--hand);font-size:20px;line-height:1;padding:0 4px;color:var(--ink);
  background:linear-gradient(transparent 42%,color-mix(in srgb,var(--tc) 45%,transparent) 42%,color-mix(in srgb,var(--tc) 45%,transparent) 92%,transparent 92%)}

/* panel: ruled notebook page with spiral binding */
.scrim{position:fixed;inset:0;background:rgba(20,18,12,.32);z-index:20}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);z-index:21;display:flex;flex-direction:column;
  background:var(--sheet);box-shadow:-10px 0 30px -12px var(--lift);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel::before{content:"";position:absolute;left:-7px;top:0;bottom:0;width:14px;z-index:2;
  background:radial-gradient(circle at 7px 12px,var(--paper) 4px,var(--line) 4.5px 5.5px,transparent 6px) 0 0/14px 26px repeat-y}
@media (prefers-reduced-motion:no-preference){.panel{animation:slide .2s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.5}}}
.p-head{display:flex;align-items:center;gap:10px;padding:14px 20px 10px 26px;box-shadow:inset 0 5px 0 var(--c)}
.p-head h2{flex:1;margin:0;font-family:var(--hand);font-weight:400;font-size:34px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-tabs{display:flex;gap:2px;overflow-x:auto;padding:0 14px 0 22px;border-bottom:2px dashed var(--line)}
.p-tabs button{flex:none;background:none;border:none;padding:6px 8px 4px;font-family:var(--hand);font-size:22px;color:var(--muted)}
.p-tabs button[aria-pressed=true]{color:var(--ink);background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 90%,transparent 90%)}
.p-tabs small{font-family:"Gowun Dodum",sans-serif;font-size:11.5px;margin-left:3px;opacity:.75}
.p-body{flex:1;overflow-y:auto;padding:18px 22px 48px 26px;
  background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-attachment:local}
.pin{position:relative;background:color-mix(in srgb,var(--hl) 40%,var(--note));padding:16px 14px 8px;margin:4px 4px 18px;transform:rotate(-.6deg);
  box-shadow:0 10px 14px -10px var(--lift)}
.pin::before{content:"";position:absolute;top:-9px;left:18px;width:70px;height:20px;background:var(--tape);transform:rotate(-4deg)}
.pin-h{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.pin-h svg{width:12px;height:12px}
.pin textarea{width:100%;border:none;padding:0;min-height:0;background:transparent;resize:none;overflow:hidden;font-size:16.5px;font-weight:700;line-height:1.5;padding-top:2px}
.pin textarea:focus{outline:none}
.pin:focus-within{outline:2px dashed var(--accent);outline-offset:3px}
.feed{list-style:none;margin:0;padding:0}
.post{position:relative;display:grid;grid-template-columns:30px 1fr;gap:12px;padding:10px 0 14px}
.post::before,.sep::before,.empty-feed::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.75}
.feed>li:first-child::before{top:24px}
.feed>li:last-child::before{bottom:calc(100% - 24px)}
.feed>li:only-child::before{display:none}
.node{position:relative;z-index:1;width:30px;height:30px;display:grid;place-items:center;margin-top:2px;background:var(--sheet);
  border:2px solid var(--tc);border-radius:52% 46% 55% 44%/47% 55% 45% 53%}
.node::after{content:"";width:11px;height:11px;background:var(--tc);border-radius:45% 55% 50% 50%}
.composer .node{background:var(--ink);border-color:var(--ink)}
.composer .node::after{content:"+";width:auto;height:auto;background:none;color:var(--paper);font-weight:700;font-size:18px;line-height:1}
.composer .pb{background:var(--sheet);border:2px solid var(--ink);border-radius:var(--wob);padding:8px 14px 10px;box-shadow:4px 4px 0 var(--ink)}
.composer .pb:focus-within{box-shadow:4px 4px 0 var(--accent)}
textarea{width:100%;font:inherit}
.composer textarea{border:none;padding:4px 0;min-height:44px;background:transparent;resize:none;overflow:hidden;font-size:15.5px}
.composer textarea:focus{outline:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.spacer{flex:1}
.typesel{display:flex;gap:2px;flex-wrap:wrap}
.typesel button{background:none;border:none;padding:0 5px;font-family:var(--hand);font-size:20px;color:var(--muted)}
.typesel button[aria-pressed=true]{color:var(--ink);background:linear-gradient(transparent 45%,color-mix(in srgb,var(--tc) 50%,transparent) 45%,color-mix(in srgb,var(--tc) 50%,transparent) 90%,transparent 90%)}
.composer .kb{font-size:11.5px;color:var(--muted)}
.ph{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.tx-row{display:flex;gap:8px;align-items:flex-start;margin-top:4px}
.tx-row input{width:17px;height:17px;margin-top:5px;accent-color:var(--tc);flex:none}
.post .tx{margin:0;white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.65}
.post.done .tx{text-decoration:line-through;text-decoration-color:var(--warn);text-decoration-thickness:2px;color:var(--muted)}
.post .pb{border-radius:6px}
.post .acts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;opacity:0;transition:opacity .12s}
.post:hover .acts,.post:focus-within .acts{opacity:1}
@media (hover:none){.post .acts{opacity:1}}
.post .acts button,.post .acts select{font-size:12px;background:var(--sheet);border:1.5px dashed var(--line);color:var(--muted);padding:1px 9px;border-radius:var(--wob)}
.sep{position:relative;padding:12px 0 0 44px;font-family:var(--hand);font-size:24px;line-height:1.2}
.empty-feed{position:relative;padding:14px 0 0 44px;color:var(--muted);font-family:var(--hand);font-size:22px}
@media (prefers-reduced-motion:no-preference){
  .post.fresh{animation:drop .34s ease-out}
  .post.fresh .pb{animation:flash 1.6s ease-out}
  @keyframes drop{from{opacity:0;transform:translateY(-10px) rotate(-1deg)}}
  @keyframes flash{from{background:color-mix(in srgb,var(--hl) 45%,transparent)}to{background:transparent}}
}

/* dialog as index card */
dialog{border:2px solid var(--ink);border-radius:var(--wob);background:var(--sheet);color:var(--ink);padding:22px 24px;width:min(420px,calc(100% - 32px));box-shadow:6px 6px 0 var(--ink)}
dialog::backdrop{background:rgba(20,18,12,.38)}
dialog h2{margin:0 0 14px;font-family:var(--hand);font-weight:400;font-size:34px;line-height:1}
.field{display:block;margin-bottom:16px}
.field>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.field input,.field select{width:100%;height:40px;border:none;border-bottom:2px solid var(--ink);border-radius:0;padding:0 2px;background:transparent}
.field input:focus,.field select:focus{outline:none;border-bottom-color:var(--accent)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border:2px solid transparent;background:var(--c);border-radius:50% 45% 52% 48%/48% 52% 45% 50%}
.swatches button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--sheet) inset;transform:rotate(-8deg) scale(1.1)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) rotate(-1deg);z-index:40;
  display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);padding:9px 18px;font-size:14px;border-radius:2px;box-shadow:0 10px 16px -10px var(--lift)}
.toast-act{background:none;border:none;color:var(--hl);font-weight:700;text-decoration:underline;padding:0}
/* tutorial */
#tourDlg{width:min(470px,calc(100% - 32px));padding:20px 22px}
.tour-visual{height:178px;margin:-2px 0 16px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:16px;overflow:hidden;
  background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:16px 16px;border:1.5px dashed var(--line)}
#tourDlg h2{font-size:32px;margin:0 0 8px}
.tour-desc{margin:0 0 14px;font-size:14.5px;line-height:1.75}
.tour-dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.tour-dots span{width:8px;height:8px;border-radius:4px;background:var(--line)}
.tour-dots span.on{background:var(--ink);width:20px}
.tv-note{position:relative;width:148px;padding:18px 12px 12px;display:flex;flex-direction:column;gap:2px;background:var(--note);
  background:color-mix(in srgb,var(--c) 24%,var(--note));transform:rotate(var(--r,0deg));box-shadow:0 10px 14px -10px var(--lift)}
.tv-note::before,.tv-pin::before{content:"";position:absolute;top:-8px;left:50%;width:56px;height:16px;transform:translateX(-50%) rotate(-3deg);background:var(--tape)}
.tv-name{font-family:var(--hand);font-weight:400;font-size:21px;line-height:1.1}
.tv-note small,.tv-pin small{font-size:10.5px;color:var(--muted);display:block}
.tv-note strong{font-size:13px;line-height:1.35}
.tv-pill{align-self:flex-start;font-size:10.5px;color:var(--warn);border:1.5px solid var(--warn);padding:0 6px;border-radius:var(--wob);transform:rotate(-2deg);margin:2px 0 4px;font-weight:700}
.tv-add{width:108px;height:118px;border:2px dashed var(--line);border-radius:var(--wob);display:grid;place-items:center;text-align:center;font-family:var(--hand);font-size:20px;color:var(--muted)}
.tv-input{width:86%;display:flex;align-items:flex-end;gap:8px}
.tv-input .l{flex:1;border-bottom:2px solid var(--ink);padding:0 2px 4px;font-size:14px;white-space:nowrap;overflow:hidden}
.tv-input .l::after{content:"";display:inline-block;width:2px;height:15px;background:var(--accent);margin-left:2px;vertical-align:-2px}
@media (prefers-reduced-motion:no-preference){.tv-input .l::after{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}}
.tv-input .s{font-size:12px;border-bottom:2px solid var(--line);padding:0 2px 4px;color:var(--muted);white-space:nowrap}
.tv-input .b{font-size:12px;font-weight:700;background:var(--ink);color:var(--paper);padding:5px 10px;border-radius:var(--wob)}
.tv-thread{width:86%;position:relative}
.tv-thread::before{content:"";position:absolute;left:9px;top:12px;bottom:18px;width:2px;background:var(--margin);opacity:.75}
.tv-post{position:relative;display:grid;grid-template-columns:20px 1fr;gap:10px;padding:5px 0;font-size:13px;line-height:1.45}
.tv-post i{width:20px;height:20px;border-radius:50% 45% 52% 48%;border:2px solid var(--tc);background:var(--sheet);position:relative;z-index:1}
.tv-post .chip{font-size:17px}
.tv-post .mini{display:flex;gap:4px;margin-top:4px}
.tv-post .mini span{font-size:10.5px;border:1.5px dashed var(--line);padding:0 6px;border-radius:var(--wob);color:var(--muted);background:var(--sheet)}
.tv-post .mini span.on{border:1.5px solid var(--accent);color:var(--accent)}
.tv-pin{position:relative;width:78%;background:color-mix(in srgb,var(--hl) 40%,var(--note));padding:16px 14px 10px;transform:rotate(-1deg);box-shadow:0 10px 14px -10px var(--lift)}
.tv-pin::before{left:30px}
.tv-pin strong{font-size:15px}
.tv-btns{display:flex;flex-direction:column;gap:9px;align-items:center}
.tv-btns span{font-size:12.5px;font-weight:700;border:2px solid var(--ink);padding:5px 14px;border-radius:var(--wob);background:var(--sheet)}
.tv-btns span.on{box-shadow:3px 3px 0 var(--hl)}
/* category manager */
#typeDlg{width:min(470px,calc(100% - 32px))}
#typeDlg h2{font-size:32px;margin:0 0 6px}
.tdesc{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.tlist{list-style:none;margin:0 0 12px;padding:0;max-height:min(46vh,380px);overflow-y:auto}
.tlist li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 2px;border-bottom:1.5px dashed var(--line)}
.tdot{width:24px;height:24px;flex:none;border:2px solid var(--ink);border-radius:50% 45% 52% 48%;background:var(--tc)}
.tname{flex:1;min-width:80px;height:36px;border:none;border-bottom:2px solid transparent;background:transparent;padding:0 2px;font-family:var(--hand);font-size:23px}
.tname:hover{border-bottom-color:var(--line)}
.tname:focus{outline:none;border-bottom-color:var(--accent)}
.tcount{font-size:12px;color:var(--muted);white-space:nowrap}
.tmove{display:flex;gap:3px}
.tmove button{background:none;border:1.5px solid var(--line);border-radius:var(--wob);font-size:12px;width:26px;height:26px;color:var(--muted)}
.tmove button:disabled{opacity:.3;cursor:default}
.tdel{background:none;border:none;color:var(--warn);font-size:12.5px;text-decoration:underline;padding:0 4px;min-width:34px}
.tlock{font-size:11.5px;color:var(--muted);padding:0 4px;min-width:34px;text-align:center}
.tpalette{flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 4px 32px}
.tpalette button{width:24px;height:24px;border:2px solid transparent;border-radius:50% 45% 52% 48%}
.tpalette button[aria-pressed=true]{border-color:var(--ink);transform:scale(1.15)}
.tadd{display:flex;gap:8px;align-items:flex-end;margin-bottom:14px}
.tadd input{flex:1;min-width:0;height:38px;border:none;border-bottom:2px solid var(--ink);background:transparent;padding:0 2px}
.tadd input:focus{outline:none;border-bottom-color:var(--accent)}
.tmanage{background:none;border:1.5px dashed var(--line);border-radius:var(--wob);font-size:12px;color:var(--muted);padding:0 8px;margin-left:4px;height:26px;align-self:center}
.tmanage:hover{color:var(--ink);border-color:var(--ink)}
/* note editing */
.edit-box{background:var(--sheet);border:2px solid var(--accent);border-radius:var(--wob);padding:8px 12px 10px}
.edit-box textarea{border:none;padding:4px 0;background:transparent;resize:none;overflow:hidden;font-size:15.5px;min-height:44px}
.edit-box textarea:focus{outline:none}
.edit-box .elabel{font-size:12px;color:var(--muted)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:560px){.capture select{flex:1 1 40%;max-width:none}.capture .btn{flex:1 1 100%}.panel::before{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>탭 보드</h1>
    <div class="tools"><span class="sync" id="sync">불러오는 중</span>
      <button type="button" class="btn small ghost" id="tourBtn">사용법</button>
      <button type="button" class="btn small" id="bkExport">백업 저장</button>
      <button type="button" class="btn small" id="bkImport">백업 불러오기</button>
      <button type="button" class="btn small" id="fileBtn" hidden>자동 저장 파일 연결</button>
      <input type="file" id="bkFile" accept=".json,application/json" hidden></div>
  </div>
  <form class="capture" id="capture" autocomplete="off">
    <label class="visually-hidden" for="capText">빠른 기록</label>
    <input type="text" id="capText" placeholder="떠오른 걸 바로 적기">
    <label class="visually-hidden" for="capProject">프로젝트</label>
    <select id="capProject"></select>
    <label class="visually-hidden" for="capType">유형</label>
    <select id="capType"></select>
    <button class="btn primary" type="submit">기록</button>
  </form>
  <p class="hint"><kbd>/</kbd> 로 어디서든 입력창으로 이동, 프로젝트를 고르지 않으면 인박스에 쌓여요.</p>
</header>

<main>
  <div class="bk-banner" id="bkBanner" role="status" hidden></div>
  <div class="filters" id="filters" role="group" aria-label="상태 필터"></div>
  <div class="grid" id="grid"></div>
</main>

<div id="panelRoot"></div>

<dialog id="projDlg">
  <form method="dialog" id="projForm">
    <h2 id="projDlgTitle">새 프로젝트</h2>
    <label class="field"><span>이름</span><input id="fName" required maxlength="60"></label>
    <div class="field"><span>색상</span><div class="swatches" id="fColors"></div></div>
    <label class="field"><span>상태</span>
      <select id="fStatus"><option value="active">진행 중</option><option value="hold">보류</option><option value="done">완료</option></select></label>
    <label class="field"><span>마감일 (선택)</span><input type="date" id="fDue"></label>
    <div class="row">
      <button type="button" class="btn small danger ghost" id="fDelete" hidden>휴지통으로 이동</button>
      <span class="spacer"></span>
      <button type="button" class="btn small" id="fCancel">취소</button>
      <button type="submit" class="btn small primary" value="save">저장</button>
    </div>
  </form>
</dialog>

<dialog id="fileDlg"><div id="fileDlgBody"></div></dialog>

<dialog id="tourDlg" aria-labelledby="tourTitle"><div id="tourBody"></div></dialog>

<dialog id="typeDlg" aria-labelledby="typeTitle"><div id="typeBody"></div></dialog>

<script>
(function(){
const COLORS=["#2B59FF","#E5484D","#12A594","#F5A524","#8E4EC6","#6B7280","#D6409F","#3E8E2F"];
const DEFAULT_TYPES=[{id:"memo",name:"메모",color:"#9A9B96"},{id:"idea",name:"아이디어",color:"#E8B10F"},{id:"decision",name:"결정",color:"#3D6BE0"},
  {id:"todo",name:"할 일",color:"#1F9E7A"},{id:"feedback",name:"피드백",color:"#E0613F"},{id:"ref",name:"레퍼런스",color:"#9A5CD6"}];
const TYPE_PALETTE=["#9A9B96","#E8B10F","#3D6BE0","#1F9E7A","#E0613F","#9A5CD6","#D6409F","#0EA5B7","#7C8A2E","#C2410C","#5B6CF0","#8B5E3C"];
const TYPE_ID=/^[a-z][a-z0-9-]{0,30}$/,TYPE_HEX=/^#[0-9a-fA-F]{6}$/,MAX_TYPES=20;
let TYPES=[],TYPE_LABEL={};
function cleanTypes(list){
  if(!Array.isArray(list)||!list.length)return JSON.parse(JSON.stringify(DEFAULT_TYPES));
  const out=[],seen=new Set();
  list.forEach(t=>{if(!t||typeof t.id!=="string"||!TYPE_ID.test(t.id)||seen.has(t.id))return;
    const name=String(t.name||"").trim().slice(0,12);if(!name)return;
    out.push({id:t.id,name,color:TYPE_HEX.test(t.color)?t.color:TYPE_PALETTE[0]});seen.add(t.id)});
  if(!seen.has("memo"))out.unshift({id:"memo",name:"메모",color:TYPE_PALETTE[0]});
  return out.slice(0,MAX_TYPES);
}
function applyTypes(list){
  state.types=cleanTypes(list);
  TYPES=state.types.map(t=>[t.id,t.name]);TYPE_LABEL=Object.fromEntries(TYPES);
  let el=document.getElementById("typeStyles");
  if(!el){el=document.createElement("style");el.id="typeStyles";document.head.appendChild(el)}
  el.textContent=state.types.map(t=>`.t-${t.id}{--tc:${t.color}}`).join("");
  if(!TYPE_LABEL[state.draftType])state.draftType="memo";
}
const STATUS={active:"진행 중",hold:"보류",done:"완료"};
const STALE_DAYS=7;
const LOCAL_KEY="tabboard-v1";

const state={projects:{},inbox:{notes:[]},filter:"active",openId:null,tlType:"all",draftType:"memo",mode:null,col:null,lastCapProject:"inbox"};
const chains={};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
function rel(ts){
  if(!ts) return "기록 없음";
  const d=(Date.now()-ts)/1000;
  if(d<60) return "방금";
  if(d<3600) return Math.floor(d/60)+"분 전";
  if(d<86400) return Math.floor(d/3600)+"시간 전";
  const days=Math.floor(d/86400);
  return days===1?"어제":days+"일 전";
}
function daysSince(ts){return ts?Math.floor((Date.now()-ts)/86400000):Infinity}
function dday(due){
  if(!due) return null;
  const t=new Date(due+"T00:00:00"); const now=new Date(); now.setHours(0,0,0,0);
  const diff=Math.round((t-now)/86400000);
  return diff===0?"D-day":diff>0?"D-"+diff:"D+"+(-diff);
}
const WD=["일","월","화","수","목","금","토"];
function dayKey(ts){const d=new Date(ts);return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0")+" ("+WD[d.getDay()]+")"}
function hm(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
let toastT;
function toast(msg,action){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}
  el.textContent=msg;
  if(action){const b=document.createElement("button");b.type="button";b.className="toast-act";b.textContent=action.label;b.onclick=()=>{el.remove();action.fn()};el.appendChild(b)}
  clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),action?5000:2200)}
function tilt(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))|0;return ((Math.abs(h)%33)-16)/10}
function lastActivity(p){const n=p.notes||[];return Math.max(p.updatedAt||0,...n.map(x=>x.ts))}

/* ---------- storage ---------- */
function saveLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify({projects:state.projects,inbox:state.inbox,types:state.types}));localStorage.setItem(SAVED_KEY,String(Date.now()))}catch(e){toast("이 브라우저에 저장할 수 없어요")}
  scheduleFileWrite();renderSync()}
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null");if(r){state.projects=r.projects||{};state.inbox=r.inbox||{notes:[]};applyTypes(r.types)}}catch(e){}}
function persist(id){
  if(state.mode!=="db"){saveLocal();return}
  const data=id==="inbox"?state.inbox:id==="settings"?{types:state.types}:state.projects[id];
  chains[id]=(chains[id]||Promise.resolve()).then(()=>data?state.col.doc(id).set(clone(data)):state.col.doc(id).delete())
    .catch(e=>{if(e&&e.code==="invalid_argument"&&state.mode==="db"){state.mode="local";saveLocal();$("#sync").textContent="이 브라우저에 저장";toast("이 계정은 저장 권한이 없어 브라우저에 저장할게요");return}
      toast(e&&e.code==="quota_exceeded"?"저장 공간이 가득 찼어요. 오래된 기록을 정리해 주세요":"저장하지 못했어요. 잠시 후 다시 시도해 주세요")});
}
async function init(){
  if(!state.types)applyTypes(null);
  loadLocalIfNoClaude();
  let db=null,user=null,id=null;
  if(window.claude&&typeof window.claude.use==="function"){
    window.claude.use("downloads").then(d=>{downloadsApi=d}).catch(()=>{});
    try{[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}catch(e){}
    if(db&&user){try{id=await user.id()}catch(e){}
      try{if(await user.can("data.write")===false)id=null}catch(e){}}
  }
  if(db&&id){
    state.mode="db";state.col=db.collection("data/users/"+id);
    $("#sync").textContent="계정에 자동 저장";
    state.col.onSnapshot(snap=>{
      const projects={};let inbox={notes:[]},types=null;
      snap.docs.forEach(d=>{if(d.id==="inbox")inbox=clone(d.data());else if(d.id==="settings")types=clone(d.data()).types;else projects[d.id]=clone(d.data())});
      applyTypes(types);
      state.projects=projects;state.inbox=inbox;if(!state.inbox.notes)state.inbox.notes=[];
      renderAll(true);
    },err=>{$("#sync").textContent="동기화가 끊겼어요. 새로고침해 주세요"});
  }else{
    state.mode="local";loadLocal();
    renderAll();afterLocalInit();
  }
}
function loadLocalIfNoClaude(){applyTypes(null);if(!window.claude){state.mode="local";loadLocal();$("#sync").textContent="이 브라우저에 저장";renderAll()}}

/* ---------- mutations ---------- */
function addNote(target,text,type){
  text=text.trim();if(!text)return false;
  const note={id:uid(),text,type,ts:Date.now(),done:false};
  if(target==="inbox"){state.inbox.notes.push(note);persist("inbox")}
  else{const p=state.projects[target];if(!p)return false;p.notes=p.notes||[];p.notes.push(note);p.updatedAt=Date.now();persist(target)}
  return true;
}
function trashProject(id){const p=state.projects[id];if(!p)return;p.deletedAt=Date.now();persist(id);if(state.openId===id)state.openId=null;renderAll();
  toast("휴지통으로 옮겼어요",{label:"되돌리기",fn:()=>restoreProject(id)})}
function restoreProject(id){const p=state.projects[id];if(!p)return;delete p.deletedAt;p.updatedAt=Date.now();persist(id);renderAll();toast(`'${p.name}' 복원했어요`)}
function notesOf(id){return id==="inbox"?state.inbox.notes:(state.projects[id]?.notes||[])}
function touch(id){if(id!=="inbox"&&state.projects[id])state.projects[id].updatedAt=Date.now();persist(id)}

/* ---------- render: capture ---------- */
function renderCapture(){
  const sel=$("#capProject");const cur=state.openId||state.lastCapProject;
  const list=Object.entries(state.projects).filter(([,p])=>p.status!=="done"&&!p.deletedAt).sort((a,b)=>a[1].name.localeCompare(b[1].name,"ko"));
  sel.innerHTML='<option value="inbox">인박스</option>'+list.map(([id,p])=>`<option value="${id}">${esc(p.name)}</option>`).join("");
  sel.value=(cur&&(cur==="inbox"||state.projects[cur]))?cur:"inbox";
  const ts=$("#capType");const keep=TYPE_LABEL[ts.value]?ts.value:"memo";
  ts.innerHTML=TYPES.map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("")+'<option value="__manage">＋ 카테고리 관리…</option>';
  ts.value=keep;ts.dataset.prev=keep;
}

/* ---------- render: grid ---------- */
function renderFilters(){
  const all=Object.values(state.projects).filter(p=>!p.deletedAt);const trashN=Object.keys(state.projects).length-all.length;
  const f=[["active","진행 중"],["hold","보류"],["done","완료"],["all","전체"],["trash","휴지통"]];
  $("#filters").innerHTML=f.map(([k,v])=>{const n=k==="trash"?trashN:k==="all"?all.length:all.filter(p=>p.status===k).length;
    return `<button type="button" data-f="${k}" aria-pressed="${state.filter===k}">${v} ${n}</button>`}).join("");
}
function cardHTML(id,p){
  const la=lastActivity(p);const last=(p.notes||[]).slice(-1)[0];
  const stale=p.status==="active"&&daysSince(la)>=STALE_DAYS&&la>0;
  const dd=dday(p.due);const openTodos=(p.notes||[]).filter(n=>n.type==="todo"&&!n.done).length;
  return `<button type="button" class="card" data-open="${id}" style="--c:${esc(p.color)};--r:${tilt(id)}deg">
    <span class="tab"><span class="swatch"></span><span class="nm">${esc(p.name)}</span></span>
    <span class="meta"><span class="pill">${STATUS[p.status]||"진행 중"}</span>${dd?`<span class="pill due">${dd}</span>`:""}${stale?`<span class="pill stale">${daysSince(la)}일째 멈춤</span>`:""}</span>
    <span class="next-label">멈춘 지점</span>
    <span class="next ${p.next?"":"empty"}">${p.next?esc(p.next):"다음에 할 일을 한 줄 남겨두세요"}</span>
    <span class="last">${last?`<span class="chip t-${last.type}">${esc(TYPE_LABEL[last.type]||"메모")}</span><p>${esc(last.text)}</p>`:"아직 기록이 없어요"}</span>
    <span class="foot"><span>마지막 기록 ${rel(la)}</span><span>${openTodos?`할 일 ${openTodos}`:""}</span></span>
  </button>`;
}
function renderGrid(){
  const g=$("#grid");
  if(state.filter==="trash"){renderTrash();return}
  let items=Object.entries(state.projects).filter(([,p])=>!p.deletedAt);
  if(state.filter!=="all")items=items.filter(([,p])=>p.status===state.filter);
  items.sort((a,b)=>lastActivity(b[1])-lastActivity(a[1]));
  let html="";
  const inboxN=state.inbox.notes.length;
  if(inboxN){const last=state.inbox.notes.slice(-1)[0];
    html+=`<button type="button" class="card inbox" data-open="inbox" style="--r:-1.2deg">
      <span class="tab"><span class="swatch"></span><span class="nm">인박스</span></span>
      <span class="meta"><span class="pill">미분류 ${inboxN}</span></span>
      <span class="next-label">정리할 기록</span>
      <span class="next">${inboxN}개를 프로젝트로 옮겨주세요</span>
      <span class="last"><span class="chip t-${last.type}">${esc(TYPE_LABEL[last.type]||"메모")}</span><p>${esc(last.text)}</p></span>
      <span class="foot"><span>마지막 기록 ${rel(last.ts)}</span><span></span></span></button>`}
  html+=items.map(([id,p])=>cardHTML(id,p)).join("");
  if(!items.length&&!inboxN){
    html+=Object.keys(state.projects).length
      ?`<p class="empty-state">이 상태의 프로젝트가 없어요.</p>`
      :`<p class="empty-state">첫 프로젝트를 추가하면 여기에 카드로 쌓여요.</p>`;
  }
  html+=`<button type="button" class="card add" data-add>+ 프로젝트 추가</button>`;
  g.innerHTML=html;
}

function renderTrash(){
  const items=Object.entries(state.projects).filter(([,p])=>p.deletedAt).sort((a,b)=>b[1].deletedAt-a[1].deletedAt);
  let html=items.length
    ?`<div class="trash-bar"><span>복원하거나 영구 삭제할 때까지 기록이 그대로 보관돼요.</span><button type="button" class="btn small danger" data-empty>휴지통 비우기</button></div>`
    :`<p class="empty-state">휴지통이 비어 있어요.</p>`;
  html+=items.map(([id,p])=>`<div class="card trashed" style="--c:${esc(p.color)};--r:${tilt(id)}deg">
    <span class="tab"><span class="swatch"></span><span class="nm">${esc(p.name)}</span></span>
    <span class="meta"><span class="pill">${rel(p.deletedAt)} 삭제</span><span class="pill">기록 ${(p.notes||[]).length}개</span></span>
    <span class="next-label">멈춘 지점</span><span class="next ${p.next?"":"empty"}">${p.next?esc(p.next):"없음"}</span>
    <span class="row"><button type="button" class="btn small primary" data-restore="${id}">복원</button><button type="button" class="btn small danger ghost" data-purge="${id}">영구 삭제</button></span>
  </div>`).join("");
  $("#grid").innerHTML=html;
}

/* ---------- render: panel (one continuous thread) ---------- */
function editHTML(n){
  return `<li class="post editing t-${state.editType}"><span class="node" aria-hidden="true"></span><div class="pb edit-box">
    <label class="elabel" for="editInput">기록 수정</label>
    <textarea id="editInput" rows="2">${esc(state.editDraft??n.text)}</textarea>
    <div class="row"><div class="typesel" role="group" aria-label="유형 변경">${TYPES.map(([k,v])=>`<button type="button" class="t-${k}" data-etype="${k}" aria-pressed="${state.editType===k}">${esc(v)}</button>`).join("")}<button type="button" class="tmanage" data-tmanage>+ 편집</button></div>
      <span class="spacer"></span><button type="button" class="btn small ghost" data-editcancel>취소</button><button type="button" class="btn small primary" data-editsave>저장</button></div>
  </div></li>`;
}

const HEX=/^#[0-9a-fA-F]{6}$/;

/* ---------- safer local storage: persist, reminder, file auto-save ---------- */
const SAVED_KEY="tabboard-savedat",BK_KEY="tabboard-lastbackup",FIRST_KEY="tabboard-firstuse",SNOOZE_KEY="tabboard-snooze";
const lsGet=k=>{try{return Number(localStorage.getItem(k))||0}catch(e){return 0}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,String(v))}catch(e){}};
const FILE_OK=(()=>{try{return "showSaveFilePicker" in window&&"showOpenFilePicker" in window&&window.self===window.top}catch(e){return false}})();
const fileLink={handle:null,status:"none",lastWrite:0,timer:null};
const JSON_TYPES=[{description:"탭 보드 데이터",accept:{"application/json":[".json"]}}];
function buildPayload(){return {app:"tab-board",version:1,exportedAt:new Date().toISOString(),savedAt:lsGet(SAVED_KEY)||Date.now(),types:state.types,projects:state.projects,inbox:state.inbox}}

const IDB={open(){return new Promise((res,rej)=>{const r=indexedDB.open("tabboard",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async run(mode,fn){const d=await IDB.open();return new Promise((res,rej)=>{const tx=d.transaction("kv",mode);const st=tx.objectStore("kv");const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)})},
  get(k){return IDB.run("readonly",st=>st.get(k))},set(k,v){return IDB.run("readwrite",st=>st.put(v,k))},del(k){return IDB.run("readwrite",st=>st.delete(k))}};

async function afterLocalInit(){

  if(FILE_OK){
    try{const h=await IDB.get("fileHandle");
      if(h){fileLink.handle=h;
        const perm=await h.queryPermission({mode:"readwrite"});
        if(perm==="granted"){fileLink.status="active";await syncFromFile()}else fileLink.status="paused"}}catch(e){}

function keyOf(id){let k=String(id).replace(/[^\w\-.~:@+]/g,"").slice(0,80);return k.startsWith("p-")?k:"p-"+(k||uid())}
function parseBoard(raw){
  if(!raw||typeof raw.projects!=="object"||!raw.projects||Array.isArray(raw.projects))return null;
  const projects={};Object.entries(raw.projects).forEach(([id,p])=>{const c=cleanProject(p);if(c)projects[keyOf(id)]=c});
  const inbox={notes:(raw.inbox&&Array.isArray(raw.inbox.notes)?raw.inbox.notes:[]).map(cleanNote).filter(Boolean)};
  return {projects,inbox,types:Array.isArray(raw.types)?raw.types:null,savedAt:Number(raw.savedAt)||Date.parse(raw.exportedAt)||0};

async function syncFromFile(){

  const localHas=Object.keys(state.projects).length||state.inbox.notes.length;
  if(fileHas&&(!localHas||board.savedAt>lsGet(SAVED_KEY))){
    const when=board.savedAt?`${dayKey(board.savedAt)} ${hm(board.savedAt)}`:"알 수 없음";
    const ok=!localHas||confirm(`연결된 파일에 이 브라우저보다 최근 기록이 있어요 (파일 저장: ${when}).\n파일 내용으로 바꿀까요?\n\n취소를 누르면 이 브라우저의 기록이 파일에 덮어써져요.`);

function openTypeDlg(){typeColorFor=null;renderTypeDlg();if(!$("#typeDlg").open)$("#typeDlg").showModal();setTimeout(()=>$("#newType")?.focus(),30)}
function addType(){
  const inp=$("#newType");const name=inp.value.trim().slice(0,12);if(!name)return;
  if(state.types.some(t=>t.name===name)){toast("같은 이름의 카테고리가 이미 있어요");return}
  if(state.types.length>=MAX_TYPES){toast(`카테고리는 ${MAX_TYPES}개까지 만들 수 있어요`);return}
  const used=new Set(state.types.map(t=>t.color.toLowerCase()));
  const color=TYPE_PALETTE.find(c=>!used.has(c.toLowerCase()))||TYPE_PALETTE[state.types.length%TYPE_PALETTE.length];
  state.types.push({id:"c"+uid(),name,color});saveTypes();renderTypeDlg();$("#newType")?.focus();toast(`'${name}' 카테고리를 추가했어요`);
}
function renameType(id,val){
  const t=state.types.find(x=>x.id===id);if(!t)return;const name=val.trim().slice(0,12);
  if(!name||name===t.name){const el=document.querySelector(`[data-tname="${id}"]`);if(el)el.value=t.name;return}
  if(state.types.some(x=>x.id!==id&&x.name===name)){toast("같은 이름의 카테고리가 이미 있어요");const el=document.querySelector(`[data-tname="${id}"]`);if(el)el.value=t.name;return}
  t.name=name;saveTypes();toast("이름을 바꿨어요");
}
function deleteType(id){
  const t=state.types.find(x=>x.id===id);if(!t||id==="memo")return;
  const n=typeCounts()[id]||0;
  if(n&&!confirm(`'${t.name}' 카테고리를 지울까요?\n이 카테고리의 기록 ${n}개는 '${TYPE_LABEL.memo}'(으)로 바뀌어요.`))return;
  Object.entries(state.projects).forEach(([pid,p])=>{let ch=false;(p.notes||[]).forEach(x=>{if(x.type===id){x.type="memo";ch=true}});if(ch)persist(pid)});
  let ch=false;(state.inbox.notes||[]).forEach(x=>{if(x.type===id){x.type="memo";ch=true}});if(ch)persist("inbox");
  state.types=state.types.filter(x=>x.id!==id);if(state.tlType===id)state.tlType="all";if(state.editType===id)state.editType="memo";
  saveTypes();renderTypeDlg();toast("카테고리를 지웠어요");
}
$("#typeDlg").addEventListener("click",e=>{

  const pk=t.closest("[data-tpick]");if(pk){const ty=state.types.find(x=>x.id===typeColorFor);if(ty){ty.color=pk.dataset.tpick;saveTypes();renderTypeDlg()}return}
  const mv=t.closest("[data-tmove]");if(mv){const i=state.types.findIndex(x=>x.id===mv.dataset.tmove),j=i+Number(mv.dataset.dir);
    if(i<0||j<0||j>=state.types.length)return;[state.types[i],state.types[j]]=[state.types[j],state.types[i]];saveTypes();renderTypeDlg();

});

});
$("#panelRoot").addEventListener("focusout",e=>{if(e.target.id==="nextInput")saveNext()});
function saveNext(){const id=state.openId;const el=$("#nextInput");if(!el||!state.projects[id])return;const v=el.value.trim();if((state.projects[id].next||"")===v)return;
  state.projects[id].next=v;touch(id);renderGrid();toast("멈춘 지점을 저장했어요")}
function submitNote(){const t=$("#noteInput");const id=state.openId;
  if(addNote(id,t.value,state.draftType)){const arr=notesOf(id);justAdded=arr[arr.length-1].id;state.draft="";
    if(state.tlType!=="all"&&state.tlType!==state.draftType)state.tlType="all";
    renderAll();setTimeout(()=>{const x=$("#noteInput");x&&x.focus()},0)}}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&state.openId&&!document.querySelector("dialog[open]")){if(state.editingNote)cancelEdit();else closePanel();return}
  if($("#tourDlg").open&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){tourGo(e.key==="ArrowRight"?1:-1);return}
  if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#capText").focus()}
});
setInterval(()=>{if(!document.hidden){renderGrid();if(state.mode==="local")renderSync()}},60000);

init();
})();
</script>
</body>
</html>
